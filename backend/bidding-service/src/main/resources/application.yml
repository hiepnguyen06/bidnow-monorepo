server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: bidding-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
      connect-timeout: 500ms

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    redis:
      enabled: false   # Redis is an optimization only; its outage must not mark bidding-service DOWN
  tracing:
    sampling:
      probability: 1.0  # reduce to 0.1 or lower in production
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/v1/bids/v3/api-docs
  swagger-ui:
    enabled: false

bidding:
  cache:
    context-ttl-seconds: 600
