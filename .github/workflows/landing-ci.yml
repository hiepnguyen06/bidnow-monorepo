name: Landing CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/landing
      - name: Run ESLint
        run: npm run lint
        working-directory: apps/landing

  build:
    name: Landing Build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/landing
      - name: Run tests
        run: npm run test
        working-directory: apps/landing
      - name: Build landing
        run: npm run build
        working-directory: apps/landing
